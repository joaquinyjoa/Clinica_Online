<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="oftalmoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17a2b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138496;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#oftalmoGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Eye shape -->
  <ellipse cx="50" cy="50" rx="25" ry="15" fill="#ffffff" stroke="#17a2b8" stroke-width="2"/>
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="10" fill="#17a2b8" stroke="#138496" stroke-width="1"/>
  
  <!-- Pupil -->
  <circle cx="50" cy="50" r="5" fill="#000000"/>
  
  <!-- Light reflection -->
  <circle cx="52" cy="47" r="2" fill="#ffffff"/>
  
  <!-- Eyelashes -->
  <path d="M25,45 Q30,40 35,45" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <path d="M25,55 Q30,60 35,55" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <path d="M65,45 Q70,40 75,45" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <path d="M65,55 Q70,60 75,55" stroke="#ffffff" stroke-width="1.5" fill="none"/>
</svg>