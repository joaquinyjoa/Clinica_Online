<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17a2b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#medicalGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Medical cross -->
  <rect x="45" y="25" width="10" height="50" fill="#ffffff" rx="2"/>
  <rect x="25" y="45" width="50" height="10" fill="#ffffff" rx="2"/>
  
  <!-- Small medical symbols -->
  <circle cx="35" cy="35" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="65" cy="35" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="35" cy="65" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="65" cy="65" r="3" fill="#ffffff" opacity="0.7"/>
</svg>