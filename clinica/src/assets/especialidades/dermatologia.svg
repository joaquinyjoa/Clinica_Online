<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dermaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#dermaGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Skin/face outline -->
  <ellipse cx="50" cy="45" rx="25" ry="30" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="38" r="2" fill="#ffc107"/>
  <circle cx="58" cy="38" r="2" fill="#ffc107"/>
  
  <!-- Nose -->
  <path d="M48,42 L50,48 L52,42" stroke="#ffc107" stroke-width="1.5" fill="none"/>
  
  <!-- Mouth -->
  <path d="M45,52 Q50,55 55,52" stroke="#ffc107" stroke-width="1.5" fill="none"/>
  
  <!-- Skin spots/texture -->
  <circle cx="40" cy="50" r="1" fill="#ffc107" opacity="0.6"/>
  <circle cx="60" cy="48" r="1" fill="#ffc107" opacity="0.6"/>
  <circle cx="35" cy="40" r="0.8" fill="#ffc107" opacity="0.6"/>
  <circle cx="65" cy="42" r="0.8" fill="#ffc107" opacity="0.6"/>
</svg>