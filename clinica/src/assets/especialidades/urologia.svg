<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="urologiaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#urologiaGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Kidney shape -->
  <path d="M40,25 Q35,30 35,40 Q35,50 40,55 Q45,60 50,55 Q55,50 55,40 Q55,30 50,25 Q45,20 40,25 Z" 
        fill="#ffffff" stroke="#007bff" stroke-width="2"/>
  
  <!-- Kidney details -->
  <ellipse cx="45" cy="40" rx="5" ry="8" fill="#007bff" opacity="0.3"/>
  
  <!-- Bladder -->
  <ellipse cx="50" cy="70" rx="8" ry="6" fill="#ffffff" stroke="#007bff" stroke-width="2"/>
  
  <!-- Connection -->
  <path d="M48,55 Q50,60 50,64" stroke="#ffffff" stroke-width="2" fill="none"/>
  
  <!-- Medical symbol -->
  <circle cx="25" cy="25" r="3" fill="#ffffff"/>
  <line x1="25" y1="22" x2="25" y2="28" stroke="#007bff" stroke-width="1"/>
  <line x1="22" y1="25" x2="28" y2="25" stroke="#007bff" stroke-width="1"/>
</svg>