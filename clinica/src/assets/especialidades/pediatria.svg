<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pediatriaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#pediatriaGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Baby/child figure -->
  <circle cx="50" cy="35" r="12" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="55" rx="8" ry="15" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Arms -->
  <ellipse cx="40" cy="50" rx="3" ry="8" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <ellipse cx="60" cy="50" rx="3" ry="8" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Legs -->
  <ellipse cx="45" cy="75" rx="3" ry="10" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <ellipse cx="55" cy="75" rx="3" ry="10" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Face features -->
  <circle cx="47" cy="32" r="1.5" fill="#fd7e14"/>
  <circle cx="53" cy="32" r="1.5" fill="#fd7e14"/>
  <path d="M47,37 Q50,39 53,37" stroke="#fd7e14" stroke-width="1.5" fill="none"/>
  
  <!-- Toy blocks around -->
  <rect x="25" y="20" width="6" height="6" fill="#ffffff" opacity="0.8" rx="1"/>
  <rect x="70" y="25" width="5" height="5" fill="#ffffff" opacity="0.8" rx="1"/>
  <rect x="75" y="65" width="6" height="6" fill="#ffffff" opacity="0.8" rx="1"/>
  <rect x="20" y="70" width="5" height="5" fill="#ffffff" opacity="0.8" rx="1"/>
</svg>