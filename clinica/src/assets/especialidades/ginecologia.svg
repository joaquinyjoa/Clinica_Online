<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ginoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ad1457;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#ginoGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Female symbol -->
  <circle cx="50" cy="40" r="15" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="50" y1="55" x2="50" y2="75" stroke="#ffffff" stroke-width="3"/>
  <line x1="42" y1="67" x2="58" y2="67" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Decorative elements -->
  <circle cx="35" cy="25" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="65" cy="25" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="25" cy="40" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="75" cy="40" r="1.5" fill="#ffffff" opacity="0.4"/>
</svg>