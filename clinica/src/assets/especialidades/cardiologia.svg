<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cardioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#cardioGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Heart shape -->
  <path d="M50,75 C50,75 25,55 25,40 C25,30 35,25 50,35 C65,25 75,30 75,40 C75,55 50,75 50,75 Z" 
        fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Heartbeat line -->
  <path d="M15,50 L30,50 L35,40 L40,60 L45,30 L50,70 L55,35 L60,55 L65,45 L70,50 L85,50" 
        stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8"/>
</svg>