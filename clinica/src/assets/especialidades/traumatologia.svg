<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="traumaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c997;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#traumaGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Bone structure -->
  <ellipse cx="50" cy="30" rx="4" ry="8" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  <rect x="48" y="35" width="4" height="30" fill="#ffffff" rx="1"/>
  <ellipse cx="50" cy="70" rx="4" ry="8" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Joint indicators -->
  <circle cx="50" cy="40" r="3" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <circle cx="50" cy="60" r="3" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  
  <!-- Bandage/cast effect -->
  <rect x="45" y="45" width="10" height="3" fill="#ffffff" opacity="0.8" rx="1"/>
  <rect x="45" y="52" width="10" height="3" fill="#ffffff" opacity="0.8" rx="1"/>
  
  <!-- Medical tools around -->
  <path d="M25,25 L35,35" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <circle cx="30" cy="30" r="2" fill="#ffffff" opacity="0.7"/>
  
  <path d="M75,25 L65,35" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <circle cx="70" cy="30" r="2" fill="#ffffff" opacity="0.7"/>
  
  <!-- X-ray indication lines -->
  <line x1="35" y1="45" x2="40" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="45" x2="65" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="55" x2="40" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="55" x2="65" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
</svg>