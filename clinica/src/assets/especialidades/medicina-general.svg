<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="medicinaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e7e34;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#medicinaGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Medical cross -->
  <rect x="42" y="25" width="16" height="50" rx="2" fill="#ffffff"/>
  <rect x="25" y="42" width="50" height="16" rx="2" fill="#ffffff"/>
  
  <!-- Stethoscope -->
  <path d="M30,25 Q35,20 40,25" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M35,25 L35,35" stroke="#ffffff" stroke-width="2"/>
  <circle cx="35" cy="38" r="3" fill="#ffffff"/>
  
  <!-- Medical bag -->
  <rect x="65" y="70" width="12" height="8" rx="1" fill="#ffffff"/>
  <rect x="67" y="68" width="8" height="2" rx="1" fill="#ffffff"/>
  <line x1="69" y1="72" x2="69" y2="76" stroke="#28a745" stroke-width="1"/>
  <line x1="67" y1="74" x2="71" y2="74" stroke="#28a745" stroke-width="1"/>
</svg>